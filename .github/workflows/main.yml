name: Gerar APK Vectras
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          link-to-sdk: true

      # Correção Aplicada: Cria um arquivo google-services.json falso para enganar o validador da Google
      - name: Ignorar Trava do Google Services
        run: |
          echo '{"project_info":{"project_number":"123456789","project_id":"vectras-mock","storage_bucket":"://appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456789","android_client_info":{"package_name":"com.vectras.vm"}},"api_key":[{"current_key":"mock_key_vectras_vm"}],"services":{"appinvite_service":{"status":1}}}]}' > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vectras-v7a-Debug-APK
          path: app/build/outputs/apk/debug/*.apk



